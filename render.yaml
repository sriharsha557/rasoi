services:
  - type: web
    name: rasoi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Required — OpenAI / Azure AI Foundry (Vision, recipes, substitutions)
      - key: OPENAI_API_KEY
        sync: false
      # OpenAI-compatible endpoint (Azure AI Foundry v1). Override if it changes.
      - key: OPENAI_BASE_URL
        value: https://IntelligentPantry-ai-foundry.services.ai.azure.com/openai/v1
      # Deployment / model name
      - key: OPENAI_MODEL
        value: gpt-5.5
      # Reasoning effort for gpt-5 models (none|low|medium|high|xhigh)
      - key: OPENAI_REASONING_EFFORT
        value: low
      # Optional — Spoonacular recipe search (tier-1 provider)
      - key: SPOONACULAR_API_KEY
        sync: false
      # Optional — Edamam recipe search (tier-2 provider)
      - key: EDAMAM_APP_ID
        sync: false
      - key: EDAMAM_APP_KEY
        sync: false
      # Supabase — image storage (PRD §6.2)
      # Get these from: Supabase → Settings → API
      - key: SUPABASE_URL
        value: https://zqzmxogaovotusxepafv.supabase.co
      - key: SUPABASE_SERVICE_KEY   # service_role key — paste in Render dashboard, never commit
        sync: false
      # Set this to your Vercel frontend URL after first deploy
      # e.g. https://rasoi.vercel.app,https://rasoi-xyz.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
